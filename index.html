<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Motos que me encantan</title>
</head>
<body>
    <h1>Las bestias que me hacen vibrar</h1>
    <p>Una guía de las motos de alto cilindraje que más me emocionan.</p>
    <ul>
        <li>Kawasaki Z900</li>
        <li>Yamaha Tracer 9 GT+</li>
        <li>BMW GS 1300 R</li>
    </ul>

    <img src="multistrada.png" alt="Multistrada V4RS">
    <a href="https://www.ducati.com">Ver más sobre Ducati</a>

    <form>
        <label for="nombre">Tu nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="favorita">¿Cuál es tu moto favorita?</label>
        <select name="favorita" id="favorita">
            <option value="" selected disabled>Elige tu moto favorita</option>
            <option value="z900">Kawasaki Z900</option>
            <option value="multistrada">Ducati Multistrada V4RS</option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
